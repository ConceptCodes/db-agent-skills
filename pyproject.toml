[project]
name = "db-agent-skills"
version = "0.1.0"
description = "A Deep Agents database assistant with audited SQLite skills"
readme = "README.md"
authors = [
    { name = "David Ojo", email = "conceptcodes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.15",
    "langchain>=1.3.2,<2.0.0",
    "langchain-community>=0.4.2",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.0.0,<2.0.0",
    "pydantic-settings>=2.10.1",
    "rich>=15.0.0,<16.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
]

[project.scripts]
db-agent-skills = "db_agent_skills.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
